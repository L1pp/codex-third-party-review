name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      BAILIAN_TOKEN_PLAN_API_KEY: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare isolated Skill runtime and official tokenizer assets
        run: python scripts/skill_runtime.py setup --download-official
      - name: Run official-runtime adapter fixtures without model calls
        run: node --test runtime/test_*.mjs
      - name: Run Python host fixtures without model calls
        run: python scripts/skill_runtime.py test
